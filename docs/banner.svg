<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="858" height="258" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">mcp-versionbridge: old handshake in, new protocol out</text>

  <rect x="30" y="70" width="170" height="70" rx="8" fill="#fff7e6" stroke="#d4a017"/>
  <text x="115" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#7a5200">Old MCP client</text>
  <text x="115" y="114" text-anchor="middle" font-size="10" fill="#334">initialize / initialized</text>
  <text x="115" y="128" text-anchor="middle" font-size="10" fill="#334">Mcp-Session-Id</text>

  <path d="M200 105 H285" stroke="#57606a" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="285" y="60" width="220" height="90" rx="8" fill="#eef4ff" stroke="#2f6fed"/>
  <text x="395" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#0b3d91">mcp-versionbridge</text>
  <text x="395" y="103" text-anchor="middle" font-size="10" fill="#334">answers initialize locally</text>
  <text x="395" y="117" text-anchor="middle" font-size="10" fill="#334">injects MCP-Protocol-Version</text>
  <text x="395" y="131" text-anchor="middle" font-size="10" fill="#334">+ _meta.clientInfo per request</text>

  <path d="M505 105 H600" stroke="#57606a" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="600" y="70" width="230" height="70" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="715" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#116329">2026-07-28 MCP server</text>
  <text x="715" y="114" text-anchor="middle" font-size="10" fill="#334">no initialize handshake --</text>
  <text x="715" y="128" text-anchor="middle" font-size="10" fill="#334">per-request header only</text>

  <text x="430" y="185" text-anchor="middle" font-size="11" fill="#57606a">The 2026-07-28 spec removed the initialize handshake entirely -- an old client</text>
  <text x="430" y="203" text-anchor="middle" font-size="11" fill="#57606a">cannot speak to a new server at all. The bridge answers the old handshake itself,</text>
  <text x="430" y="221" text-anchor="middle" font-size="11" fill="#57606a">then forwards every call shaped exactly as a native 2026-07-28 client would send it.</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
